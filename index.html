<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <!-- CSS FILES -->
    <link rel="stylesheet" href="reset.css" />
    <link rel="stylesheet" href="styles.css" />
    <!-- JS FILES -->
    <script src="script.js" defer></script>
  </head>
  <body>
    <!-- Header bar -->
    <header>
      <div class="header-content">
        <div class="brand">
          <span class="brand-logo"></span>
          <div class="brand-text">
            <span>Jacob</span>
            <span class="dot-separator"></span>
            <span>Titong</span>
          </div>
        </div>
        <span class="profile-icon"></span>
      </div>
    </header>

    <!-- Main content -->
    <main>
      <aside>
        <h1>All Posts <span class="number-of-posts">[00]</span></h1>
        <nav>
          <ul>
            <li>
              <span class="minus-icon"></span> All
              <span class="number-of-posts"></span>
            </li>
            <li>
              <span class="minus-icon"></span> Item 1
              <span class="number-of-posts"></span>
            </li>
            <li><span class="add-icon"></span> Add new journal</li>
          </ul>
        </nav>
        <div class="status">
          <span class="posts-count"
            >Posts: <span class="number-of-posts">00</span></span
          >
          <span class="dot-separator"></span>
          <span class="authors-count"
            >Authors: <span class="number-of-authors">00</span></span
          >
        </div>
        <div class="add-log">
          <button><span class="plus-icon"></span>Create new log</button>
        </div>
      </aside>
    </main>

    <!-- Footer bar -->
    <footer>
      <div class="footer-content">
        <span>Design Inspiration from <a href="">Mobbin</a></span>
        <span class="dot-separator"></span>
        <span>Created by <a href="">Jacob Titong</a></span>
      </div>
    </footer>
  </body>
</html>
