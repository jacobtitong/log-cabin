<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <!-- CSS FILES -->
    <link rel="stylesheet" href="reset.css" />
    <link rel="stylesheet" href="styles.css" />
    <!-- JS FILES -->
    <script src="script.js" defer></script>
  </head>
  <body>
    <!-- Header bar -->
    <header>
      <div class="header-content">
        <div class="brand">
          <span class="brand-logo icon"
            ><svg
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <g clip-path="url(#clip0_23_118)">
                <path
                  d="M12 1C16.6825 1 20.6792 3.92668 22.2666 8.0498H11.8506V9.66016H16.8193V21.8887C15.3638 22.5994 13.7289 23 12 23C8.08388 23 4.64836 20.9519 2.69922 17.8701C3.42778 18.1394 4.23372 18.2764 5.11816 18.2764C6.68204 18.2763 7.88522 17.8692 8.72852 17.0566C9.57185 16.2286 9.99414 15.0632 9.99414 13.5605V3.0498H5.60938C7.41102 1.76109 9.61598 1 12 1ZM22.748 9.66016C22.9115 10.4144 23 11.1969 23 12C23 15.6333 21.2371 18.8534 18.5215 20.8564V9.66016H22.748ZM8.29199 4.66016V13.4004C8.29192 14.4274 8.00853 15.2247 7.44141 15.792C6.88941 16.3593 6.0915 16.6426 5.04883 16.6426C4.38963 16.6426 3.76097 16.5206 3.16309 16.2754C2.58049 16.0301 2.02098 15.6462 1.48438 15.125L1.46094 15.1553C1.1621 14.1557 1 13.0968 1 12C1 9.17912 2.06283 6.60715 3.80859 4.66016H8.29199Z"
                  fill="white"
                />
              </g>
              <defs>
                <clipPath id="clip0_23_118">
                  <rect width="24" height="24" fill="white" />
                </clipPath>
              </defs>
            </svg>
          </span>
          <div class="brand-text">
            <span>Jacob</span>
            <span class="dot-separator icon"
              ><svg
                width="2"
                height="2"
                viewBox="0 0 2 2"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
              >
                <circle cx="1" cy="1" r="1" />
              </svg>
            </span>
            <span>Titong</span>
          </div>
        </div>
        <span class="profile-icon icon"
          ><svg
            width="40"
            height="40"
            viewBox="0 0 40 40"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <g clip-path="url(#clip0_23_127)">
              <path
                d="M26.6667 16.6667C26.6667 20.35 23.6834 23.3333 20 23.3333C16.3167 23.3333 13.3334 20.35 13.3334 16.6667C13.3334 12.9833 16.3167 10 20 10C23.6834 10 26.6667 12.9833 26.6667 16.6667Z"
                fill="white"
              />
              <path
                fill-rule="evenodd"
                clip-rule="evenodd"
                d="M20 40C31.05 40 40 31.05 40 20C40 8.95 31.05 0 20 0C8.95 0 0 8.95 0 20C0 31.05 8.95 40 20 40ZM30.45 35.0667C35.2167 31.75 38.3333 26.25 38.3333 20C38.3333 9.86667 30.1333 1.66667 20 1.66667C9.86667 1.66667 1.66667 9.86667 1.66667 20C1.66667 26.25 4.78333 31.75 9.55 35.0667C10.725 32.8667 14.5167 26.6667 20 26.6667C25.4833 26.6667 29.2667 32.8667 30.45 35.0667Z"
                fill="white"
              />
            </g>
            <defs>
              <clipPath id="clip0_23_127">
                <rect width="40" height="40" fill="white" />
              </clipPath>
            </defs>
          </svg>
        </span>
      </div>
    </header>

    <!-- Main content -->
    <main>
      <div class="main-content">
        <aside>
          <div class="sticky">
            <div class="menu">
              <h1>All Posts <span class="number-of-posts">[00]</span></h1>
              <nav>
                <ul>
                  <div class="journal-list">
                    <li id="all" class="clicked">
                      <span class="minus-icon icon"
                        ><svg
                          xmlns="http://www.w3.org/2000/svg"
                          height="24px"
                          viewBox="0 -960 960 960"
                          width="24px"
                          fill="#e3e3e3"
                        >
                          <path d="M200-440v-80h560v80H200Z" /></svg
                      ></span>
                      All
                      <span class="number-of-posts">[00]</span>
                    </li>
                  </div>
                  <div>
                    <li class="add-journal">
                      <span class="plus-icon icon"
                        ><svg
                          xmlns="http://www.w3.org/2000/svg"
                          height="24px"
                          viewBox="0 -960 960 960"
                          width="24px"
                          fill="#e3e3e3"
                        >
                          <path
                            d="M440-440H200v-80h240v-240h80v240h240v80H520v240h-80v-240Z"
                          /></svg
                      ></span>
                      Add new journal
                    </li>
                  </div>
                </ul>
              </nav>
              <div class="library-status">
                <span class="posts-count"
                  >Posts: <span class="number-of-posts">00</span></span
                >
                <span class="dot-separator icon"
                  ><svg
                    width="2"
                    height="2"
                    viewBox="0 0 2 2"
                    fill="none"
                    xmlns="http://www.w3.org/2000/svg"
                  >
                    <circle cx="1" cy="1" r="1" fill="#8D8D8E" />
                  </svg>
                </span>
                <span class="authors-count"
                  >Authors: <span class="number-of-authors">00</span></span
                >
              </div>
            </div>

            <div class="add-log">
              <button>
                <span class="plus-icon icon"
                  ><svg
                    xmlns="http://www.w3.org/2000/svg"
                    height="24px"
                    viewBox="0 -960 960 960"
                    width="24px"
                    fill="#e3e3e3"
                  >
                    <path
                      d="M440-440H200v-80h240v-240h80v240h240v80H520v240h-80v-240Z"
                    /></svg></span
                >Create new log
              </button>
            </div>
          </div>
        </aside>
        <div class="logs-content"></div>
      </div>
    </main>

    <!-- Dialog -->
    <dialog class="dialog-log" popover>
      <div class="dialog-contents">
        <span class="exit-button icon">
          <svg
            width="9"
            height="8"
            viewBox="0 0 9 8"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M1.29871 0.201292C1.15653 0.0688116 0.968487 -0.00331137 0.774186 0.000116847C0.579885 0.00354506 0.394499 0.0822568 0.257086 0.21967C0.119673 0.357083 0.0409616 0.542468 0.0375334 0.736769C0.0341052 0.93107 0.106228 1.11912 0.238708 1.26129L2.95871 3.98129L0.238708 6.70129C0.165021 6.76995 0.105919 6.85275 0.0649272 6.94475C0.0239353 7.03675 0.00189351 7.13607 0.000116721 7.23677C-0.00166006 7.33747 0.0168646 7.4375 0.0545856 7.53089C0.0923066 7.62428 0.148451 7.70911 0.21967 7.78033C0.290889 7.85155 0.375722 7.90769 0.469111 7.94541C0.562499 7.98314 0.662528 8.00166 0.763231 7.99988C0.863934 7.99811 0.963247 7.97606 1.05525 7.93507C1.14725 7.89408 1.23005 7.83498 1.29871 7.76129L4.01871 5.04129L6.73871 7.76129C6.80737 7.83498 6.89017 7.89408 6.98217 7.93507C7.07417 7.97606 7.17348 7.99811 7.27419 7.99988C7.37489 8.00166 7.47492 7.98314 7.56831 7.94541C7.66169 7.90769 7.74653 7.85155 7.81775 7.78033C7.88897 7.70911 7.94511 7.62428 7.98283 7.53089C8.02055 7.4375 8.03908 7.33747 8.0373 7.23677C8.03552 7.13607 8.01348 7.03675 7.97249 6.94475C7.9315 6.85275 7.87239 6.76995 7.79871 6.70129L5.07871 3.98129L7.79871 1.26129C7.93119 1.11912 8.00331 0.93107 7.99988 0.736769C7.99646 0.542468 7.91774 0.357083 7.78033 0.21967C7.64292 0.0822568 7.45753 0.00354506 7.26323 0.000116847C7.06893 -0.00331137 6.88088 0.0688116 6.73871 0.201292L4.01871 2.92129L1.29871 0.201292Z"
              fill="black"
            />
          </svg>
        </span>
        <form action="">
          <div class="content-controls">
            <label for="heading">
              <input
                type="text"
                name="heading"
                id="heading"
                placeholder="Heading Title"
                required
              />
            </label>
            <label for="paragraph">
              <textarea
                type="text"
                name="paragraph"
                id="paragraph"
                placeholder="Paragraph Text"
                required
              ></textarea>
            </label>
          </div>
          <div class="additional-controls">
            <label for="date">
              <span>DATE:</span>
              <span class="calendar-icon icon">
                <svg
                  width="24"
                  height="27"
                  viewBox="0 0 24 27"
                  fill="none"
                  xmlns="http://www.w3.org/2000/svg"
                >
                  <path
                    d="M21.3333 24H2.66667V9.33333H21.3333M17.3333 0V2.66667H6.66667V0H4V2.66667H2.66667C1.18667 2.66667 0 3.85333 0 5.33333V24C0 24.7072 0.280951 25.3855 0.781048 25.8856C1.28115 26.3857 1.95942 26.6667 2.66667 26.6667H21.3333C22.0406 26.6667 22.7189 26.3857 23.219 25.8856C23.719 25.3855 24 24.7072 24 24V5.33333C24 4.62609 23.719 3.94781 23.219 3.44771C22.7189 2.94762 22.0406 2.66667 21.3333 2.66667H20V0M18.6667 14.6667H12V21.3333H18.6667V14.6667Z"
                    fill="#3D3D3D"
                  />
                </svg>
              </span>
              <input type="date" name="date" id="date" required />
            </label>
            <label for="author">
              <span>AUTHOR:</span>
              <span class="author-icon icon">
                <svg
                  width="16"
                  height="16"
                  viewBox="0 0 16 16"
                  fill="none"
                  xmlns="http://www.w3.org/2000/svg"
                >
                  <path
                    d="M8 0C9.06087 0 10.0783 0.421427 10.8284 1.17157C11.5786 1.92172 12 2.93913 12 4C12 5.06087 11.5786 6.07828 10.8284 6.82843C10.0783 7.57857 9.06087 8 8 8C6.93913 8 5.92172 7.57857 5.17157 6.82843C4.42143 6.07828 4 5.06087 4 4C4 2.93913 4.42143 1.92172 5.17157 1.17157C5.92172 0.421427 6.93913 0 8 0ZM8 10C12.42 10 16 11.79 16 14V16H0V14C0 11.79 3.58 10 8 10Z"
                    fill="black"
                  />
                </svg>
              </span>
              <input
                type="text"
                name="author"
                id="author"
                placeholder="author name"
                required
              />
            </label>
            <button>Submit</button>
          </div>
        </form>
      </div>
    </dialog>

    <!-- Footer bar -->
    <footer>
      <div class="footer-content">
        <span>Design Inspiration from <a href="">Mobbin</a></span>
        <span class="dot-separator icon"
          ><svg
            width="2"
            height="2"
            viewBox="0 0 2 2"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <circle cx="1" cy="1" r="1" fill="#8D8D8E" />
          </svg>
        </span>
        <span>Created by <a href="">Jacob Titong</a></span>
      </div>
    </footer>
  </body>
</html>
